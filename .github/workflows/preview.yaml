name: Vercel Preview Deployment
env:
  VERCEL_ORG_ID: ${{ team_secyA1ZxfM1teKTUWOEfLDQS }}
  VERCEL_PROJECT_ID: ${{ prj_pzPKM7ZMuDKG0YXuZFIg5RkpabRT }}
on:
  push:
    branches-ignore:
      - master
jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ MKPLRLgqq111Dk6m0v32dA0c }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ MKPLRLgqq111Dk6m0v32dA0c }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ MKPLRLgqq111Dk6m0v32dA0c }}
